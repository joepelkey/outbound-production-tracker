<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Outbound Production Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
        }
        .container { max-width: 1000px; }
        .card {
            border-radius: 12px;
            background-color: #161b22;
            border-color: #30363d;
        }
        h1.h3, h1.h4, h5 { color: #e6edf3; }
        .card-title { color: #e6edf3; font-weight: 600; }
        .btn-primary { background: linear-gradient(90deg, #2563eb 0%, #7c3aed 100%); border: none; }
        .btn-primary:hover { opacity: 0.95; }
        .btn-green {
            background-color: #238636;
            border-color: #238636;
            color: #ffffff;
        }
        .btn-green:hover {
            background-color: #2ea043;
            border-color: #2ea043;
        }
        .btn-orange {
            background-color: #fb8500;
            border-color: #fb8500;
            color: #ffffff;
        }
        .btn-orange:hover {
            background-color: #ff9500;
            border-color: #ff9500;
        }
        .btn-success {
            background-color: #238636;
            border-color: #238636;
            color: #ffffff;
        }
        .btn-success:hover {
            background-color: #2ea043;
            border-color: #2ea043;
        }
        .btn-outline-danger {
            color: #f85149;
            border-color: #f85149;
        }
        .btn-outline-danger:hover {
            background-color: #f85149;
            color: #ffffff;
            border-color: #f85149;
        }
        .btn-outline-secondary {
            color: #e6edf3;
            border-color: #30363d;
        }
        .btn-outline-secondary:hover {
            background-color: #30363d;
            color: #e6edf3;
        }
        .table { color: #e6edf3; }
        .table thead th { border-bottom: 0; }
        .table-striped > tbody > tr:nth-of-type(odd) > * {
            background-color: rgba(255, 255, 255, 0.05);
        }
        .table-hover > tbody > tr:hover > * {
            background-color: rgba(255, 255, 255, 0.075);
        }
        .form-control, .form-control-sm, .form-select, .form-select-sm {
            background-color: #0d1117;
            border-color: #30363d;
            color: #e6edf3;
        }
        .form-control:focus, .form-control-sm:focus, .form-select:focus, .form-select-sm:focus {
            background-color: #0d1117;
            border-color: #2563eb;
            color: #e6edf3;
        }
        .form-label {
            color: #8b949e;
        }
        .text-muted {
            color: #8b949e !important;
        }
    </style>
</head>
<body class="bg-dark text-light">
    <div class="container py-4">
        <div class="mb-4">
            <h1 class="h3 mb-1">Outbound Production Tracker</h1>
            <p class="text-muted small mb-0">Created by Joe Pelkey</p>
        </div>

        <div class="mb-3">
            <label class="form-label">Select Dock to Add:</label>
            <div class="d-flex gap-2">
                <select id="dockSelector" class="form-select form-select-sm" style="max-width: 200px;">
                    <option value="">-- Choose Dock --</option>
                    <option value="PD1">PD1</option>
                    <option value="PD2">PD2</option>
                    <option value="PD3">PD3</option>
                    <option value="PD4">PD4</option>
                    <option value="PD5">PD5</option>
                    <option value="PD6">PD6</option>
                    <option value="PD7">PD7</option>
                    <option value="PD8">PD8</option>
                    <option value="PD9">PD9</option>
                    <option value="PD10">PD10</option>
                    <option value="PD11">PD11</option>
                    <option value="PD12">PD12</option>
                    <option value="PD13">PD13</option>
                    <option value="SDs">SDs</option>
                    <option value="HUB SEC">HUB SEC</option>
                    <option value="PKG SEC">PKG SEC</option>
                </select>
                <button type="button" id="addDockBtn" class="btn btn-sm btn-success">Add Dock</button>
            </div>
        </div>

        <form id="productionForm">
            <div id="docksContainer" class="row g-3">
                <!-- Dock cards will be added here dynamically -->
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-green btn-lg">Compute</button>
                <button type="reset" class="btn btn-orange btn-lg">Reset</button>
            </div>
        </form>

        <!-- Results Section -->
        <div id="resultsSection" style="display: none;" class="mt-5">
            <h4 class="mb-3">Results</h4>
            <div class="table-responsive mb-3">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Dock</th>
                            <th>Volume</th>
                            <th>Hours</th>
                            <th>Plan (PPH)</th>
                            <th>Actual Production (PPH)</th>
                            <th>Excess Hours</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        // Import from modules when served from a web server
        // For standalone use, the functions are defined inline below

        // ============================================
        // Core Metrics Functions (from src/metrics.js)
        // ============================================

        const AVAILABLE_DOCKS = ['PD1', 'PD2', 'PD3', 'PD4', 'PD5', 'PD6', 'PD7', 'PD8', 'PD9', 'PD10', 'PD11', 'PD12', 'PD13', 'SDs', 'HUB SEC', 'PKG SEC'];
        const DEFAULT_DOCKS = ['PD10', 'PD11', 'SDs', 'HUB SEC'];

        function calculateActualProduction(volume, hours) {
            if (hours === 0) return 0;
            return volume / hours;
        }

        function calculateExcessHours(hours, volume, plan) {
            if (plan === 0) return hours;
            return hours - (volume / plan);
        }

        function parseNumericInput(value) {
            const parsed = parseFloat(value);
            return isNaN(parsed) ? 0 : parsed;
        }

        function validateDockData(dockData) {
            return {
                volume: Math.max(0, parseNumericInput(dockData?.volume)),
                hours: Math.max(0, parseNumericInput(dockData?.hours)),
                plan: Math.max(0, parseNumericInput(dockData?.plan))
            };
        }

        function computeDockMetrics(dockData) {
            const validated = validateDockData(dockData);
            const { volume, hours, plan } = validated;
            return {
                volume,
                hours,
                plan,
                actual_production: calculateActualProduction(volume, hours),
                excess_hours: calculateExcessHours(hours, volume, plan)
            };
        }

        function computeAllMetrics(docksData) {
            const results = {};
            let totalVolume = 0;
            let totalHours = 0;
            let totalExcess = 0;

            for (const [dockName, dockData] of Object.entries(docksData)) {
                const metrics = computeDockMetrics(dockData);
                results[dockName] = metrics;
                totalVolume += metrics.volume;
                totalHours += metrics.hours;
                totalExcess += metrics.excess_hours;
            }

            const outboundProduction = totalHours !== 0 ? totalVolume / totalHours : 0;
            results['Outbound'] = {
                volume: totalVolume,
                hours: totalHours,
                plan: null,
                actual_production: outboundProduction,
                excess_hours: totalExcess
            };

            return results;
        }

        function formatNumber(value) {
            if (typeof value !== 'number' || isNaN(value)) return '0.00';
            return value.toFixed(2);
        }

        function isValidDock(dockName) {
            return AVAILABLE_DOCKS.includes(dockName);
        }

        // ================================================
        // Dock Manager Functions (from src/dockManager.js)
        // ================================================

        function getDockElementId(dockName) {
            if (!dockName || typeof dockName !== 'string') return '';
            return 'dock-' + dockName.replace(/\s/g, '-');
        }

        // ============================================
        // UI Code
        // ============================================

        const docksContainer = document.getElementById('docksContainer');
        const dockSelector = document.getElementById('dockSelector');
        const addDockBtn = document.getElementById('addDockBtn');
        const productionForm = document.getElementById('productionForm');
        const resultsSection = document.getElementById('resultsSection');
        const resultsTableBody = document.getElementById('resultsTableBody');
        const addedDocks = new Set();

        function createDockCard(dockName) {
            if (addedDocks.has(dockName)) {
                alert(dockName + ' is already added');
                return;
            }

            addedDocks.add(dockName);
            const col = document.createElement('div');
            col.className = 'col-12 col-md-6';
            col.id = getDockElementId(dockName);

            col.innerHTML = `
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">${dockName}</h5>
                            <button type="button" class="btn btn-sm btn-outline-danger remove-dock-btn" data-dock="${dockName}">Remove</button>
                        </div>
                        <div class="row g-2">
                            <div class="col-12">
                                <label class="form-label small">Volume</label>
                                <input name="${dockName}_volume" class="form-control form-control-sm" type="number" step="any" min="0" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small">Hours</label>
                                <input name="${dockName}_hours" class="form-control form-control-sm" type="number" step="any" min="0" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small">Plan (PPH)</label>
                                <input name="${dockName}_plan" class="form-control form-control-sm" type="number" step="any" min="0" required>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            docksContainer.appendChild(col);
        }

        function removeDock(dockName) {
            const dockId = getDockElementId(dockName);
            const element = document.getElementById(dockId);
            if (element) {
                element.remove();
                addedDocks.delete(dockName);
            }
        }

        // Event delegation for remove buttons
        docksContainer.addEventListener('click', function(e) {
            if (e.target.classList.contains('remove-dock-btn')) {
                const dockName = e.target.dataset.dock;
                removeDock(dockName);
            }
        });

        addDockBtn.addEventListener('click', function() {
            const selectedDock = dockSelector.value;
            if (selectedDock) {
                createDockCard(selectedDock);
                dockSelector.value = '';
            } else {
                alert('Please select a dock to add');
            }
        });

        function collectDockData(activeDocks) {
            const docksData = {};
            for (const dock of activeDocks) {
                const volumeInput = document.querySelector(`input[name="${dock}_volume"]`);
                const hoursInput = document.querySelector(`input[name="${dock}_hours"]`);
                const planInput = document.querySelector(`input[name="${dock}_plan"]`);

                docksData[dock] = {
                    volume: volumeInput?.value || 0,
                    hours: hoursInput?.value || 0,
                    plan: planInput?.value || 0
                };
            }
            return docksData;
        }

        function displayResults(results) {
            resultsTableBody.innerHTML = '';

            for (const [dockName, data] of Object.entries(results)) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${dockName}</td>
                    <td>${formatNumber(data.volume)}</td>
                    <td>${formatNumber(data.hours)}</td>
                    <td>${data.plan !== null ? formatNumber(data.plan) : '-'}</td>
                    <td><strong>${formatNumber(data.actual_production)}</strong></td>
                    <td><strong>${formatNumber(data.excess_hours)}</strong></td>
                `;
                resultsTableBody.appendChild(row);
            }

            resultsSection.style.display = 'block';
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        productionForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const activeDocks = Array.from(addedDocks);
            if (activeDocks.length === 0) {
                alert('Please add at least one dock');
                return;
            }

            const docksData = collectDockData(activeDocks);
            const results = computeAllMetrics(docksData);
            displayResults(results);
        });

        // Add default docks on page load
        DEFAULT_DOCKS.forEach(dock => createDockCard(dock));
    </script>
</body>
</html>
